# spiky.team — лендинг команды
# Распределение поддоменов:
#   spiky.team      — лендинг, ссылки на проекты
#   mc.spiky.team   — лаунчер: сайт, мета, i18n, скачивания

server {
    listen 80;
    listen [::]:80;
    server_name spiky.team www.spiky.team;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spiky.team www.spiky.team;

    ssl_certificate     /etc/letsencrypt/live/spiky.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiky.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/spiky.team;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript text/xml application/xml application/json;

    # Редиректы на поддомены
    location = /mc {
        return 301 https://mc.spiky.team/;
    }
    location = /launcher {
        return 301 https://mc.spiky.team/;
    }
    location = /download {
        return 301 https://github.com/SpikyTeam/SpikyMC/releases;
    }

    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}