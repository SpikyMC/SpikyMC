# mc.spiky.team — все сервисы лаунчера (статика)
# Основной vhost: сайт, мета, i18n, fmllibs, downloads, wiki

server {
    listen 80;
    listen [::]:80;
    server_name mc.spiky.team;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mc.spiky.team;

    # ---------- TLS (SAN: spiky.team + mc.spiky.team) ----------
    ssl_certificate     /etc/letsencrypt/live/spiky.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiky.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---------- Корень ----------
    root /var/www/mc.spiky.team;
    index index.html;

    # ---------- Общие настройки ----------
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types application/json application/xml text/plain text/css text/javascript application/javascript application/octet-stream;

    # ---------- Мета (генерируется SpikyTeam/meta на сервере) ----------
    location /meta/ {
        alias /var/www/mc.spiky.team/meta/;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- Переводы ----------
    location /i18n/ {
        alias /var/www/mc.spiky.team/i18n/;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------- Legacy FML libs (MC <= 1.5.2) ----------
    location /fmllibs/ {
        alias /var/www/mc.spiky.team/fmllibs/;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- Дистрибутивы лаунчера ----------
    # Раздаются через GitHub releases: https://github.com/SpikyTeam/SpikyMC/releases
    location /downloads/ {
        return 301 https://github.com/SpikyTeam/SpikyMC/releases;
    }

    # ---------- Вики / справка ----------
    location /wiki/ {
        alias /var/www/mc.spiky.team/wiki/;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- Сайт (корень) ----------
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- Безопасность ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}